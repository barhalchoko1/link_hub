<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Orqa fon radial gradienti -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2a0508" />
      <stop offset="50%" stop-color="#100204" />
      <stop offset="100%" stop-color="#020001" />
    </radialGradient>

    <!-- Qizil harf uchun bo'rttirilgan 3D gradient -->
    <linearGradient id="redBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b5c" />
      <stop offset="25%" stop-color="#ff1744" />
      <stop offset="60%" stop-color="#d50000" />
      <stop offset="85%" stop-color="#9b0000" />
      <stop offset="100%" stop-color="#4d0000" />
    </linearGradient>

    <!-- Qirra yorug'ligi (Highlight) -->
    <linearGradient id="edgeHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="30%" stop-color="#ff8a95" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#d50000" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#300000" stop-opacity="0.9" />
    </linearGradient>

    <!-- Ichki chuqurlik soyasi -->
    <linearGradient id="innerShadow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Qizil neon nurlanish filtri (Glow) -->
    <filter id="crimsonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Bo'rttirilgan 3D soya -->
    <filter id="emboss3D" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#ff002b" flood-opacity="0.45" />
      <feDropShadow dx="6" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- Qora orqa fon -->
  <rect width="512" height="512" rx="256" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="254" fill="none" stroke="#ff1744" stroke-opacity="0.2" stroke-width="3" />
  <circle cx="256" cy="256" r="248" fill="none" stroke="#250407" stroke-width="2" />

  <!-- Yengil orqa fon qizil radiusi -->
  <circle cx="256" cy="250" r="160" fill="#ff0033" opacity="0.12" filter="blur(40px)" />

  <!-- 3D Bo'rtib chiqqan B harfi qatlamlari -->
  <g filter="url(#emboss3D)">
    <!-- Asosiy pastki 3D ekstruziya qatlami (chuqur qora-qizil soya) -->
    <path
      d="M 160 100 
         L 285 100 
         C 345 100, 385 130, 385 185 
         C 385 220, 360 245, 325 256 
         C 375 268, 400 302, 400 345 
         C 400 405, 350 435, 285 435 
         L 160 435 
         Z 
         M 228 155 
         L 228 235 
         L 275 235 
         C 305 235, 322 222, 322 195 
         C 322 168, 305 155, 275 155 
         Z 
         M 228 285 
         L 228 380 
         L 282 380 
         C 315 380, 335 365, 335 332 
         C 335 300, 315 285, 282 285 
         Z"
      transform="translate(0, 10)"
      fill="#280005"
    />

    <!-- O'rta bo'rtma qatlami (To'q qizil) -->
    <path
      d="M 160 100 
         L 285 100 
         C 345 100, 385 130, 385 185 
         C 385 220, 360 245, 325 256 
         C 375 268, 400 302, 400 345 
         C 400 405, 350 435, 285 435 
         L 160 435 
         Z 
         M 228 155 
         L 228 235 
         L 275 235 
         C 305 235, 322 222, 322 195 
         C 322 168, 305 155, 275 155 
         Z 
         M 228 285 
         L 228 380 
         L 282 380 
         C 315 380, 335 365, 335 332 
         C 335 300, 315 285, 282 285 
         Z"
      transform="translate(0, 5)"
      fill="#68000d"
    />

    <!-- Oldingi asosiy bo'rtma qatlam (Yorqin qizil gradient) -->
    <path
      d="M 160 100 
         L 285 100 
         C 345 100, 385 130, 385 185 
         C 385 220, 360 245, 325 256 
         C 375 268, 400 302, 400 345 
         C 400 405, 350 435, 285 435 
         L 160 435 
         Z 
         M 228 155 
         L 228 235 
         L 275 235 
         C 305 235, 322 222, 322 195 
         C 322 168, 305 155, 275 155 
         Z 
         M 228 285 
         L 228 380 
         L 282 380 
         C 315 380, 335 365, 335 332 
         C 335 300, 315 285, 282 285 
         Z"
      fill="url(#redBevel)"
      stroke="url(#edgeHighlight)"
      stroke-width="5"
      stroke-linejoin="round"
    />

    <!-- Yorug'lik akslantiruvchi qirralar (Chiroyli nurlar) -->
    <!-- Yuqori yaltirash chizig'i -->
    <path
      d="M 165 104 L 285 104 C 335 104, 375 128, 380 178"
      fill="none"
      stroke="#ffffff"
      stroke-width="4"
      stroke-linecap="round"
      opacity="0.8"
    />
    <path
      d="M 168 108 L 168 430"
      fill="none"
      stroke="#ff94a2"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.6"
    />

    <!-- Ichki tuynuklarning yuqori nur akslanishi -->
    <path
      d="M 232 158 L 275 158 C 300 158, 316 168, 318 190"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.6"
    />
    <path
      d="M 232 288 L 282 288 C 310 288, 328 298, 330 325"
      fill="none"
      stroke="#ffffff"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.5"
    />
  </g>
</svg>
